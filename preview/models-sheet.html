<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Models Sheet</title>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }
</script>
<style>
  body { margin: 0; background: #1a1a1a; color: #fff; font: 12px sans-serif; }
  #labels { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(6, 1fr); grid-auto-rows: 160px; pointer-events: none; }
  #labels div { padding: 3px; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="labels"></div>
<script type="module">
import * as THREE from 'three';
import { MODEL_NAMES, loadModels, model } from '../src/models.js';
// 正面（+z）から見る。?yaw=名前:角度 で試せる
const cols = 6, cellH = 160;
const renderer = new THREE.WebGLRenderer({ antialias: true });
const rows = Math.ceil(MODEL_NAMES.length / cols);
renderer.setSize(innerWidth, rows * cellH);
renderer.setScissorTest(true);
document.body.appendChild(renderer.domElement);
const side = new URLSearchParams(location.search).get('side') || 'front';
await loadModels();
const labels = document.getElementById('labels');
MODEL_NAMES.forEach((name, i) => {
  const d = document.createElement('div');
  d.textContent = `${i} ${name}`;
  labels.appendChild(d);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x2a2a2a);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.5));
  const m = model(name, { h: 1 });
  if (!m) return;
  scene.add(m);
  const box = new THREE.Box3().setFromObject(m);
  const s = box.getSize(new THREE.Vector3());
  const r = Math.max(s.x, s.y, s.z);
  const cam = new THREE.PerspectiveCamera(30, (innerWidth / cols) / cellH, 0.01, 50);
  const dir = side === 'front' ? new THREE.Vector3(0, 0.35, 1) : new THREE.Vector3(1, 0.35, 0);
  cam.position.copy(dir.normalize().multiplyScalar(r * 2.6)).add(new THREE.Vector3(0, s.y / 2, 0));
  cam.lookAt(0, s.y / 2, 0);
  const x = (i % cols) * (innerWidth / cols), y = rows * cellH - (Math.floor(i / cols) + 1) * cellH;
  renderer.setViewport(x, y, innerWidth / cols, cellH);
  renderer.setScissor(x, y, innerWidth / cols, cellH);
  renderer.render(scene, cam);
});
</script>
</body>
</html>
